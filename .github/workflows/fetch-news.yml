name: Scan & Fetch LLM Updates

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger this script manually from GitHub Repository tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Write .env file from secret
        run: echo "${{ secrets.ENV }}" > .env

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Fetch & Summarize Script
        run: |
          node backend/fetchUpdates.js
